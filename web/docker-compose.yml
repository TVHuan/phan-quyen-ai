version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: baseweb_mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: baseweb
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data:
